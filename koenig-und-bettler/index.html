const words = {
 language:['Sprache','Language','Langue','Idioma','Lingua'],
 rulesBtn:['Regeln','Rules','Règles','Reglas','Regole'],close:['Schließen','Close','Fermer','Cerrar','Chiudi'],
 rulesGoal:['Ziel und Rollen','Goal and roles','But et rôles','Objetivo y roles','Obiettivo e ruoli'],
 rulesGoalText:['Werde als Erste oder Erster alle Karten los und werde in der nächsten Runde König. Wer zuletzt Karten hat, wird Bettler. Die übrigen Plätze bestimmen die weiteren Rollen: Bei 3 Spielern gibt es einen Bürger; ab 4 gibt es Vize-König und Vize-Bettler, dazwischen gegebenenfalls Bürger.','Be the first to shed all your cards to become king next round. The last player with cards becomes beggar. The other places determine the remaining roles: with 3 players there is a citizen; from 4 players there are a vice-king and vice-beggar, with citizens in between if applicable.','Débarrassez-vous de toutes vos cartes en premier pour devenir roi à la manche suivante. Le dernier joueur avec des cartes devient mendiant. Les autres places déterminent les rôles : à 3 joueurs, il y a un citoyen ; à partir de 4, un vice-roi et un vice-mendiant, et éventuellement des citoyens entre eux.','Descarta todas tus cartas primero para ser rey en la siguiente ronda. El último con cartas será mendigo. Los demás puestos determinan los roles: con 3 jugadores hay un ciudadano; desde 4 hay un virrey y un vicemendigo, y ciudadanos entre ellos si corresponde.','Scarta tutte le carte per primo per diventare re nel round successivo. L’ultimo con carte diventa mendicante. Le altre posizioni determinano i ruoli: con 3 giocatori c’è un cittadino; da 4 ci sono un vice-re e un vice-mendicante, con eventuali cittadini tra loro.'],
 rulesSetup:['Vorbereitung','Setup','Préparation','Preparación','Preparazione'],
 rulesSetupText:['3 bis 8 Spieler erhalten alle 52 Karten möglichst gleichmäßig. In Runde 1 eröffnet, wer die Kreuz 3 hat; ab Runde 2 eröffnet der König nach dem Tribut.','All 52 cards are dealt as evenly as possible among 3 to 8 players. In round 1, the player with the 3 of clubs leads; from round 2 the king leads after tribute.','Les 52 cartes sont distribuées aussi équitablement que possible à 3 à 8 joueurs. En première manche, le détenteur du 3 de trèfle ouvre ; dès la deuxième, le roi ouvre après le tribut.','Las 52 cartas se reparten lo más equitativamente posible entre 3 y 8 jugadores. En la primera ronda abre quien tiene el 3 de tréboles; desde la segunda abre el rey tras el tributo.','Le 52 carte sono distribuite il più equamente possibile tra 3 e 8 giocatori. Nel primo round apre chi ha il 3 di fiori; dal secondo apre il re dopo il tributo.'],
 rulesRanking:['Karten-Rangfolge','Card ranking','Hiérarchie des cartes','Jerarquía de cartas','Gerarchia delle carte'],
 rulesRankingText:['Aufsteigend: 3, 4, 5, 6, 7, 8, 9, 10, Bube (J), Dame (Q), König (K), Ass (A), 2. Die Farben sind gleichwertig.','Ascending: 3, 4, 5, 6, 7, 8, 9, 10, Jack (J), Queen (Q), King (K), Ace (A), 2. Suits have equal rank.','Ordre croissant : 3, 4, 5, 6, 7, 8, 9, 10, valet (J), dame (Q), roi (K), as (A), 2. Les couleurs sont équivalentes.','Orden ascendente: 3, 4, 5, 6, 7, 8, 9, 10, jota (J), dama (Q), rey (K), as (A), 2. Los palos tienen el mismo valor.','Ordine crescente: 3, 4, 5, 6, 7, 8, 9, 10, fante (J), donna (Q), re (K), asso (A), 2. I semi hanno lo stesso valore.'],
 rulesPlay:['Ablauf und Klettern','Play and climbing','Déroulement','Desarrollo','Svolgimento'],
 rulesLead:['Bei freiem Tisch eröffnet man mit einer Einzelkarte, einem Paar, Drilling oder Vierling gleichen Ranges.','On an empty table, lead a single card, pair, three or four cards of the same rank.','Sur une table libre, ouvrez avec une carte, une paire, un brelan ou un carré de même rang.','Con la mesa libre, abre con una carta, pareja, trío o cuatro cartas del mismo rango.','A tavolo libero, apri con una carta, una coppia, un tris o quattro carte dello stesso valore.'],
 rulesFollow:['Die nächsten Spieler legen dieselbe Anzahl Karten eines streng höheren Ranges oder passen. Wer passt, darf im selben Stich später wieder einsteigen.','The next players play the same number of cards of a strictly higher rank or pass. A player who passes may re-enter the same trick later.','Les joueurs suivants posent le même nombre de cartes de rang strictement supérieur ou passent. Un joueur qui passe peut revenir dans le même pli.','Los siguientes jugadores juegan el mismo número de cartas de rango estrictamente superior o pasan. Quien pasa puede volver a jugar en la misma baza.','I giocatori successivi giocano lo stesso numero di carte di valore strettamente superiore oppure passano. Chi passa può rientrare nella stessa presa.'],
 rulesClear:['Passen alle anderen nacheinander, wird der Tisch geleert. Wer zuletzt gelegt hat, eröffnet neu; ist diese Person bereits fertig, eröffnet der nächste aktive Spieler.','When everyone else passes in succession, the table is cleared. The last player to play leads again; if that player has finished, the next active player leads.','Si tous les autres passent à la suite, la table est vidée. Le dernier joueur ayant posé ouvre à nouveau ; s’il a terminé, le prochain joueur actif ouvre.','Cuando todos los demás pasan consecutivamente, se limpia la mesa. Quien jugó por última vez abre de nuevo; si ya terminó, abre el siguiente jugador activo.','Se tutti gli altri passano consecutivamente, il tavolo si libera. Chi ha giocato per ultimo apre di nuovo; se ha finito, apre il prossimo giocatore attivo.'],
 rulesSpecial:['Sonderregeln','Special rules','Règles spéciales','Reglas especiales','Regole speciali'],
 rulesTwo:['2 räumt ab (Hausregel): Eine gültig gespielte 2 leert den Tisch sofort. Wer sie spielt, eröffnet neu; ist die Hand leer, eröffnet der nächste aktive Spieler.','2 clears (house rule): A legally played 2 clears the table immediately. The player leads again, or the next active player leads if their hand is empty.','Le 2 vide la table (règle maison) : un 2 joué légalement vide immédiatement la table. Le joueur ouvre à nouveau, ou le prochain joueur actif s’il n’a plus de cartes.','El 2 limpia la mesa (regla de la casa): un 2 jugado válidamente limpia la mesa al instante. Quien lo juega abre de nuevo; si ya no tiene cartas, abre el siguiente jugador activo.','Il 2 libera il tavolo (regola della casa): un 2 giocato validamente libera subito il tavolo. Chi lo gioca apre di nuovo; se ha finito le carte, apre il prossimo giocatore attivo.'],
 rulesRevolution:['Revolution (Hausregel): Jeder gespielte Vierling kehrt die Rangfolge bis zum nächsten Vierling oder zum Rundenende um; dann ist 3 hoch und 2 niedrig. Beide Sonderregeln können in der Lobby ein- oder ausgeschaltet werden.','Revolution (house rule): Each four of a kind reverses the ranking until the next four of a kind or the end of the round; 3 is then high and 2 low. Both special rules can be switched on or off in the lobby.','Révolution (règle maison) : chaque carré inverse la hiérarchie jusqu’au carré suivant ou à la fin de la manche ; le 3 devient alors le plus fort et le 2 le plus faible. Les deux règles spéciales sont configurables dans le salon.','Revolución (regla de la casa): cada grupo de cuatro invierte la jerarquía hasta el siguiente o el final de la ronda; el 3 pasa a ser el más alto y el 2 el más bajo. Ambas reglas especiales se activan o desactivan en la sala.','Rivoluzione (regola della casa): ogni poker inverte la gerarchia fino al poker successivo o alla fine del round; il 3 diventa il più alto e il 2 il più basso. Entrambe le regole speciali si possono attivare o disattivare nella lobby.'],
 rulesTribute:['Tribut ab Runde 2','Tribute from round 2','Tribut dès la deuxième manche','Tributo desde la segunda ronda','Tributo dal secondo round'],
 rulesTributeText:['Der Bettler gibt automatisch seine 2 höchsten Karten an den König. Der König wählt danach 2 beliebige Karten aus seiner neuen Hand zur Rückgabe. Bei 4 oder mehr Spielern gibt der Vize-Bettler seine höchste Karte an den Vize-König, der anschließend 1 beliebige Karte zurückgibt. Bürger tauschen nicht. Nach allen Rückgaben beginnt das Spiel.','The beggar automatically gives their 2 highest cards to the king. The king then chooses any 2 cards from their new hand to return. With 4 or more players, the vice-beggar gives their highest card to the vice-king, who then returns any 1 card. Citizens do not exchange cards. Play starts after all returns.','Le mendiant donne automatiquement ses 2 cartes les plus fortes au roi. Le roi choisit ensuite 2 cartes quelconques de sa nouvelle main à rendre. À partir de 4 joueurs, le vice-mendiant donne sa carte la plus forte au vice-roi, qui rend ensuite 1 carte de son choix. Les citoyens n’échangent pas. Le jeu commence après tous les retours.','El mendigo entrega automáticamente sus 2 cartas más altas al rey. Después, el rey elige 2 cartas cualesquiera de su nueva mano para devolver. Con 4 o más jugadores, el vicemendigo entrega su carta más alta al virrey, que devuelve 1 carta a su elección. Los ciudadanos no intercambian cartas. La partida comienza tras todas las devoluciones.','Il mendicante dà automaticamente le sue 2 carte più alte al re. Il re sceglie poi 2 carte qualsiasi dalla nuova mano da restituire. Con almeno 4 giocatori, il vice-mendicante dà la carta più alta al vice-re, che restituisce 1 carta a scelta. I cittadini non scambiano carte. Il gioco inizia dopo tutte le restituzioni.'],
 tagline:['Das Kartenspiel um Krone und Besen. Werde zuerst alle Karten los!','The card game of crown and broom. Be the first to shed your cards!','Le jeu de la couronne et du balai. Débarrassez-vous de vos cartes !','El juego de la corona y la escoba. ¡Descarta tus cartas primero!','Il gioco della corona e della scopa. Scarta tutte le carte per primo!'],

 tribute:['Tribut · Kartensteuer','Tribute · card exchange','Tribut · échange','Tributo · intercambio','Tributo · scambio'],tributeInfo:['Bettler geben ihre höchsten Karten ab. König und Vize-König wählen nach Erhalt ihre Rückgabe.','Beggars give their highest cards. King and vice-king choose what to return after receiving them.','Les mendiants donnent leurs cartes les plus fortes. Le roi et le vice-roi choisissent ensuite leurs retours.','Los mendigos entregan sus cartas más altas. El rey y el virrey eligen qué devolver después.','I mendicanti danno le carte più alte. Re e vice-re scelgono poi cosa restituire.'],chooseReturn:['Wähle die geforderte Anzahl Karten zur Rückgabe.','Select the required number of cards to return.','Choisissez le nombre de cartes à rendre.','Elige la cantidad de cartas que devolverás.','Scegli il numero di carte da restituire.'],confirm:['Rückgabe bestätigen','Confirm return','Confirmer le retour','Confirmar devolución','Conferma restituzione'],waitingTribute:['Warte auf die Rückgaben.','Waiting for returns.','En attente des retours.','Esperando las devoluciones.','In attesa delle restituzioni.'],returns:['Rückgabe','Return','Retour','Devolución','Restituzione'],given:['Abgegebene Karten','Cards given','Cartes données','Cartas entregadas','Carte cedute'],

 clearTimeout(botTimer);if(role!=='host'||!S||demoPending||(rulesOpen&&S.demo))return;
 if(S.phase==='SHOWDOWN'&&S.demo){botTimer=setTimeout(()=>showDemo(()=>t('podium'),()=>`<p>${esc(t('demoNext'))}</p>`,()=>startRound()),3000);return;}
 if(S.phase==='TRIBUTE'){
  const exchange=S.tribute.find(x=>!x.done&&find(x.to).bot);if(!exchange)return;
  botTimer=setTimeout(()=>{const p=find(exchange.to),cards=sortHand(p.hand.slice()).slice(0,exchange.count);const run=()=>act(p.id,'TRIBUTE_SELECT',{cards:cards.map(cardId)});
   if(S.demo)showDemo(()=>`${p.name} · ${t('tribute')}`,()=>`<p>${esc(t('tributeInfo'))}</p><p><b>${esc(find(exchange.from).name)} → ${esc(p.name)}:</b> ${exchange.given.map(short).join(' ')}</p><p><b>${esc(t('botHand'))}:</b> ${p.hand.map(short).join(' ')}</p><p><b>${esc(t('returns'))}:</b> ${cards.map(short).join(' ')}</p><p>${esc(t('demoTribute'))}</p>`,run);else run();},S.demo?1000:650);return;
 }
 if(S.phase!=='PLAYING')return;const p=find(S.turn);if(!p||!p.bot)return;
 botTimer=setTimeout(()=>{const cards=botChoice(p),run=()=>act(p.id,cards?'ACTION':'PASS',cards?{cards:cards.map(cardId)}:{});
  if(S.demo)showDemo(()=>`${p.name} · ${t('turn')}`,()=>`<p><b>${esc(t('botHand'))}:</b> ${p.hand.map(short).join(' ')}</p><p><b>${esc(t('table'))}:</b> ${S.table?S.table.cards.map(short).join(' '):'—'}</p><p><b>${esc(t('options'))}:</b> ${esc(t(S.table?'demoRespond':'demoLead'))} ${esc(t('demoSpecial'))}</p><p><b>${esc(t('why'))}:</b> ${esc(t(cards?'demoChoice':'demoPass'))}</p><p><b>${esc(t(cards?'play':'pass'))}:</b> ${cards?cards.map(short).join(' '):'—'}</p>`,run);else run();},S.demo?900:500);
}
function peerAvailable(){if(typeof Peer==='undefined'){toast(t('peerMissing'));return false;}return true;}
function bindPeer(p){
 p.on('disconnected',()=>{if(peer!==p)return;status(t('reconnecting'));retry();});
 p.on('error',e=>{console.error('PeerJS:',e);if(peer!==p)return;if(e.type==='peer-unavailable'||e.type==='network'||e.type==='server-error'||e.type==='socket-error'){status(`${t('reconnecting')} (${e.type})`);retry();}else{status(`${t('networkError')}: ${e.type}`);toast(`${t('networkError')}: ${e.type}`);}});
}
function retry(){
 if(reconnectTimer||!peer||peer.destroyed)return;
 reconnectTimer=setTimeout(()=>{reconnectTimer=null;if(!peer||peer.destroyed)return;if(peer.disconnected){try{peer.reconnect();}catch(e){console.error('Reconnect:',e);status(`${t('networkError')}: ${e.message}`);retry();}}else if(role==='client'&&peer.open&&(!conn||!conn.open))connectToHost();},2000);
}
function hostPeer(p){
 bindPeer(p);
 p.on('connection',c=>{
  let id=null;
  c.on('data',msg=>{
   if(!msg||typeof msg!=='object')return;
   if(msg.type==='HELLO'&&!id){
    if(role!=='host'||!S){c.close();return;}
    let found=S.players.find(x=>!x.bot&&x.token===msg.token);
    if(!found){
     if(S.phase!=='LOBBY'||S.players.length>=8||typeof msg.name!=='string'||!msg.name.trim()||msg.name.length>24||typeof msg.token!=='string'||msg.token.length<16){c.send({type:'REJECT',reason:'full'});setTimeout(()=>c.close(),300);return;}
     found=player(uid(),msg.name.trim());found.token=msg.token;S.players.push(found);
    }
    id=found.id;const old=connections.get(id);connections.set(id,c);if(old&&old!==c)old.close();found.connected=true;c.send({type:'WELCOME',id,room:S.room});sync();
   }else if(id&&connections.get(id)===c){
    if(msg.type==='SYNC_REQUEST')c.send({type:'STATE_SYNC',state:makeView(id)});
    else if(['ACTION','PASS','TRIBUTE_SELECT'].includes(msg.type)){if(act(id,msg.type,msg))c.send({type:'ACTION_ACCEPTED'});else c.send({type:'ERROR',key:'invalid'});}
    else if(msg.type==='MIGRATION_READY'&&S.phase==='SHOWDOWN'&&S.migrating===id&&typeof msg.room==='string'&&/^KB-\d{4}$/.test(msg.room))finishMigration(id,msg.room);
    else if(msg.type==='MIGRATION_FAILED'&&S.migrating===id){delete S.migrating;sync();toast(t('networkError'));}
   }
  });
  c.on('close',()=>{if(id&&connections.get(id)===c){connections.delete(id);const p=S&&find(id);if(p){p.connected=false;sync();}}});
  c.on('error',e=>{console.error('Host connection:',e);status(`${t('networkError')}: ${e.type||e.message}`);});
 });
}
function openHost(){
 if(!peerAvailable())return;
 room=code();myId=uid();const me=player(myId,name);myToken=me.token;S={room,phase:'LOBBY',round:0,players:[me],rules:{clearTwo:true,revolution:false},finished:[],table:null,turn:null,passes:0,reversed:false,tribute:[],demo:false,lastAction:null};role='host';mode='game';view=makeView(myId);render();status(t('connecting'));
 function attempt(){const p=new Peer(room);peer=p;let opened=false;hostPeer(p);p.on('open',()=>{if(peer!==p)return;opened=true;status(t('connected'));sync();});p.on('error',e=>{if(peer===p&&e.type==='unavailable-id'&&!opened){p.destroy();room=code();S.room=room;attempt();sync();}});}
 attempt();
}
function startDemo(){role='host';mode='game';myId=null;room='DEMO';S={room,phase:'LOBBY',round:0,players:['Ada','Ben','Clara','David'].map(n=>player(uid(),n,true)),rules:{clearTwo:true,revolution:true},finished:[],table:null,turn:null,passes:0,reversed:false,tribute:[],demo:true,lastAction:null};status('');startRound();}
function connectClient(){
 if(!peerAvailable())return;
 role='client';mode='game';myToken=uid();myId=null;view=null;status(t('connecting'));render();openClientPeer();
}
function openClientPeer(){
 const p=new Peer();peer=p;bindPeer(p);p.on('open',()=>{if(peer!==p)return;connectToHost();});
}
function connectToHost(){
 if(!peer||peer.destroyed||peer.disconnected||connecting||role!=='client')return;
 connecting=true;const c=peer.connect(room,{reliable:true});conn=c;
 c.on('open',()=>{if(conn!==c)return;connecting=false;c.send({type:'HELLO',name,token:myToken});});
 c.on('data',msg=>{
  if(conn!==c||!msg||typeof msg!=='object')return;
  if(msg.type==='WELCOME'){myId=msg.id;status(t('connected'));}
  else if(msg.type==='STATE_SYNC'){updateView(msg.state);const me=view.players.find(p=>p.id===myId);const available=new Set((me&&me.hand||[]).map(cardId));selected=new Set([...selected].filter(id=>available.has(id)));status(t('connected'));render();}
  else if(msg.type==='SOUND'&&Array.isArray(msg.sounds))playSounds(msg.sounds);
  else if(msg.type==='ACTION_ACCEPTED'){selected.clear();render();}
  else if(msg.type==='ERROR')toast(t(msg.key));
  else if(msg.type==='REJECT'){toast(t(msg.reason));reset();}
  else if(msg.type==='MIGRATE_PREPARE')prepareMigration();
  else if(msg.type==='MIGRATE_COMMIT')becomeHost(msg.state,msg.room);
  else if(msg.type==='MIGRATE'){room=msg.room;status(t('migration'));conn=null;c.close();connectToHost();}
 });
 c.on('close',()=>{if(conn!==c)return;connecting=false;conn=null;if(role==='client'){status(t('reconnecting'));retry();}});
 c.on('error',e=>{console.error('Client connection:',e);if(conn===c){connecting=false;status(`${t('reconnecting')} (${e.type||e.message})`);retry();}});
 setTimeout(()=>{if(conn===c&&connecting){connecting=false;c.close();if(conn===c)conn=null;status(t('reconnecting'));retry();}},12000);
}
function prepareMigration(){
 if(migrationPeer||!peerAvailable())return;
 status(t('migration'));let attempts=0;
 function attempt(){
  const newRoom=code(),p=new Peer(newRoom);migrationPeer=p;let opened=false;
  p.on('open',()=>{if(migrationPeer!==p)return;opened=true;if(!conn||!conn.open){p.destroy();migrationPeer=null;status(t('reconnecting'));return;}conn.send({type:'MIGRATION_READY',room:newRoom});migrationTimer=setTimeout(()=>{if(migrationPeer===p){p.destroy();migrationPeer=null;status(t('networkError'));}},15000);});
  p.on('error',e=>{if(migrationPeer!==p)return;p.destroy();migrationPeer=null;if(e.type==='unavailable-id'&&!opened&&++attempts<10)attempt();else{console.error('Migration:',e);status(`${t('networkError')}: ${e.type}`);if(conn&&conn.open)conn.send({type:'MIGRATION_FAILED'});}});
 }
 attempt();
}
function finishMigration(id,newRoom){
 const target=connections.get(id);if(!target||!target.open){delete S.migrating;sync();return;}
 S.room=newRoom;delete S.migrating;target.send({type:'MIGRATE_COMMIT',room:newRoom,state:S});
 for(const [pid,c] of connections)if(pid!==id&&c.open)c.send({type:'MIGRATE',room:newRoom});
 const old=peer;connections.clear();role='client';room=newRoom;S=null;conn=null;peer=null;old.destroy();status(t('migration'));openClientPeer();
}
function becomeHost(state,newRoom){
 if(!migrationPeer||!migrationPeer.open){toast(t('networkError'));return;}
 clearTimeout(migrationTimer);const old=peer;peer=migrationPeer;migrationPeer=null;role='host';room=newRoom;S=state;S.players.forEach(p=>{if(!p.bot)p.connected=p.id===myId;});connections=new Map();conn=null;hostPeer(peer);old.destroy();status(t('connected'));sync();
}
function resumeNetwork(){
 if(!peer||peer.destroyed)return;
 if(peer.disconnected){clearTimeout(reconnectTimer);reconnectTimer=null;retry();}
 else if(role==='client'){if(conn&&conn.open)conn.send({type:'SYNC_REQUEST'});else{connecting=false;connectToHost();}}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)resumeNetwork();});
window.addEventListener('online',resumeNetwork);
function reset(){
 clearTimeout(botTimer);clearTimeout(demoTimer);clearTimeout(reconnectTimer);clearTimeout(migrationTimer);demoTimer=null;demoPending=null;demoPopup=null;demoPaused=false;demoRemainingMs=0;demoDeadline=0;rulesOpen=false;rulesResumeDemo=false;rulesFocus=null;document.getElementById('rules-popup').innerHTML='';reconnectTimer=null;connecting=false;
 if(migrationPeer)migrationPeer.destroy();migrationPeer=null;
 const old=peer;peer=null;role=null;if(old)old.destroy();connections.clear();conn=null;S=null;view=null;myId=null;myToken=null;selected.clear();mode='start';document.getElementById('popup').innerHTML='';status('');render();
}
function sendAction(type,cards){
 if(role==='host'){if(!act(myId,type,{cards}))toast(t('invalid'));else{selected.clear();render();}}
 else if(conn&&conn.open)conn.send({type,cards});
 else toast(t('reconnecting'));
}
function render(){
 const app=document.getElementById('app');
 const previousHand=app.querySelector('.hand'),handScroll=previousHand?previousHand.scrollLeft:0;
 if(mode==='start'){
  app.innerHTML=`<section class="start"><span class="badge">♠ ♥ ♦ ♣ · 3–8</span><h1 class="title">König und Bettler</h1><p class="subtitle" data-i18n="tagline"></p><div class="choices"><button class="choice" data-do="hostForm"><span class="icon">👑</span><b data-i18n="host"></b><span data-i18n="hostDesc"></span></button><button class="choice" data-do="joinForm"><span class="icon">🃏</span><b data-i18n="join"></b><span data-i18n="joinDesc"></span></button><button class="choice" data-do="demo"><span class="icon">🎓</span><b data-i18n="demo"></b><span data-i18n="demoDesc"></span></button></div></section>`;translate(app);return;
 }
 if(mode==='hostForm'||mode==='joinForm'){
  app.innerHTML=`<div class="panel form stack"><h2>${esc(t(mode==='hostForm'?'host':'join'))}</h2><div class="field"><label for="name">${esc(t('name'))}</label><input id="name" maxlength="24" autocomplete="nickname" value="${esc(name)}"></div>${mode==='joinForm'?`<div class="field"><label for="room">${esc(t('room'))}</label><input id="room" maxlength="7" placeholder="1234 / KB-1234" autocapitalize="characters"></div>`:''}<div class="row"><button class="btn" data-do="back">${esc(t('back'))}</button><button class="btn primary" data-do="${mode==='hostForm'?'create':'connect'}">${esc(t(mode==='hostForm'?'create':'join'))}</button></div></div>`;return;
 }
 if(!view){app.innerHTML=`<div class="panel"><p>${esc(t('connecting'))}</p><button class="btn" data-do="leave">${esc(t('leave'))}</button></div>`;return;}
 const v=view,me=v.players.find(p=>p.id===myId),isHost=role==='host',isDemo=v.demo,byId=id=>v.players.find(p=>p.id===id);
 const header=`<div class="top panel"><div class="row"><span class="badge ${isDemo?'gold':''}">${esc(isDemo?t('demoBadge'):v.room)}</span>${v.round?`<span class="badge">${esc(t('round'))} ${v.round}</span>`:''}${v.phase==='PLAYING'?`<span class="badge">${esc(t(v.reversed?'reversed':'normal'))}</span>`:''}</div><button class="btn small" data-do="leave">${esc(t('leave'))}</button></div>`;
 const chips=v.players.map(p=>`<span class="chip ${v.turn===p.id&&v.phase==='PLAYING'?'active':''} ${!p.connected?'offline':''}">${p.bot?'🤖 ':''}${esc(p.name)}${p.id===myId?' ('+esc(t('you'))+')':''} · ${ROLE_ICON[p.role]} ${esc(t(p.role))}${v.phase!=='LOBBY'?' · '+p.count+' '+esc(t('cards')):''}${v.finished.includes(p.id)?' · #'+(v.finished.indexOf(p.id)+1):''}${!p.connected?' · '+esc(t('offline')):''}${isHost&&v.phase==='LOBBY'&&p.bot?` <button class="btn small" data-remove="${p.id}" aria-label="${esc(t('remove'))}">×</button>`:''}</span>`).join('');
 if(v.phase==='LOBBY'){
  app.innerHTML=header+`<div class="grid"><section class="panel stack"><div><h2>${esc(t('room'))}</h2><div class="code">${esc(v.room)}</div></div><div><h3>${esc(t('players'))} · ${v.players.length}/8</h3><div class="row">${chips}</div></div>${isHost?`<div class="row"><button class="btn" data-do="addBot">${esc(t('addBot'))}</button><button class="btn green ${v.players.length<3?'locked':''}" data-do="start">${esc(t('start'))}</button></div><span class="muted">${esc(t('minPlayers'))}</span>`:`<p class="muted">${esc(t('waitingHost'))}</p>`}</section><section class="panel stack"><h2>${esc(t('rules'))}</h2>${['clearTwo','revolution'].map(key=>`<label class="rule"><span><b>${esc(t(key))}</b>${key==='revolution'?`<br><small class="muted">${esc(t('reverseInfo'))}</small>`:''}</span>${isHost?`<input type="checkbox" data-rule="${key}" ${v.rules[key]?'checked':''}>`:`<span>${v.rules[key]?'✓':'—'}</span>`}</label>`).join('')}<p class="muted">${esc(t('normal'))}</p></section></div>`;return;
 }
 if(v.phase==='SHOWDOWN'){
  app.innerHTML=header+`<div class="panel stack"><h2>🏆 ${esc(t('podium'))}</h2><div class="podium">${v.finished.map((id,i)=>`<div><b>${i+1}.</b> ${esc(byId(id).name)} · ${ROLE_ICON[byId(id).role]} ${esc(t(byId(id).role))}</div>`).join('')}</div>${isHost&&!isDemo?`<div class="row"><button class="btn green" data-do="next">${esc(t('next'))}</button>${v.players.filter(p=>!p.bot&&p.id!==myId&&p.connected).map(p=>`<button class="btn warn" data-handover="${p.id}">${esc(t('handover'))} ${esc(p.name)}</button>`).join('')}</div>`:!isDemo?`<p class="muted">${esc(t('waitingHost'))}</p>`:''}</div>`;return;
 }
 const myHand=me&&me.hand?me.hand:[];
 let content=`<section class="panel"><div class="row">${chips}</div></section>`;
 if(v.phase==='TRIBUTE'){
  const pending=v.tribute.find(x=>x.to===myId&&!x.done);
  content+=`<section class="panel tribute-panel"><h2>👑 ${esc(t('tribute'))}</h2><p>${esc(t('tributeInfo'))}</p>${v.tribute.map(x=>`<p>${esc(byId(x.from).name)} → ${esc(byId(x.to).name)} · ${x.count} ${esc(t('cards'))} · ${x.done?'✓':'⏳'}${x.given?`<br><span class="muted">${esc(t('given'))}: ${x.given.map(short).join(' ')}</span>`:''}</p>`).join('')}<p class="badge gold">${esc(t(pending?'chooseReturn':'waitingTribute'))}${pending?' ('+pending.count+')':''}</p></section>`;
 }else{
  const last=v.lastAction, table=v.table;
  content+=`<section class="table"><div class="row spread"><b>${esc(t('table'))}</b><span class="badge">${esc(t('turn'))}: ${esc(byId(v.turn).name)}</span></div><div class="table-cards">${table?table.cards.map(c=>cardHTML(c)).join(''):`<p class="muted">${esc(t('empty'))}</p>`}</div>${last?`<div class="muted">${esc(byId(last.id).name)} ${esc(t(last.type))}${last.cards?' · '+last.cards.map(short).join(' '):''}</div>`:''}</section>`;
 }
 if(me)content+=`<section class="panel"><div class="row spread"><h3>${esc(t('hand'))} · ${myHand.length}</h3><span class="muted">${esc(t('selected'))}: ${selected.size}</span></div><div class="hand">${myHand.map(c=>cardHTML(c,true)).join('')||`<span class="muted">${esc(t('finished'))}</span>`}</div></section>`;
 if(me&&myHand.length){
  if(v.phase==='TRIBUTE'){const pending=v.tribute.find(x=>x.to===myId&&!x.done);if(pending)content+=`<div class="dock"><button class="btn primary" data-do="tribute">${esc(t('confirm'))} (${pending.count})</button></div>`;}
  else content+=`<div class="dock"><button class="btn green ${v.turn!==myId?'locked':''}" data-do="play">${esc(t('play'))}</button><button class="btn ${v.turn!==myId||!v.table?'locked':''}" data-do="pass">${esc(t('pass'))}</button></div>`;
 }
 app.innerHTML=header+`<div class="stack">${content}</div>`;
 const currentHand=app.querySelector('.hand');if(currentHand)currentHand.scrollLeft=handScroll;
}
document.addEventListener('click',e=>{
 if(e.target.id==='rules-overlay'){closeRules();return;}
 const card=e.target.closest('[data-card]');if(card){const id=card.dataset.card;selected.has(id)?selected.delete(id):selected.add(id);render();return;}
 const remove=e.target.closest('[data-remove]');if(remove&&role==='host'&&S.phase==='LOBBY'){S.players=S.players.filter(p=>p.id!==remove.dataset.remove||!p.bot);sync();return;}
 const handover=e.target.closest('[data-handover]');if(handover&&role==='host'&&S.phase==='SHOWDOWN'&&!S.migrating){const c=connections.get(handover.dataset.handover);if(c&&c.open){S.migrating=handover.dataset.handover;c.send({type:'MIGRATE_PREPARE'});status(t('migration'));setTimeout(()=>{if(S&&S.migrating===handover.dataset.handover){delete S.migrating;status(t('networkError'));sync();}},20000);}return;}
 const b=e.target.closest('[data-do]');if(!b)return;
 switch(b.dataset.do){
  case 'hostForm':case 'joinForm':mode=b.dataset.do;render();break;
  case 'back':mode='start';render();break;
  case 'create':case 'connect':{name=document.getElementById('name').value.trim().slice(0,24);if(!name){toast(t('needName'));return;}if(b.dataset.do==='create')openHost();else{room=document.getElementById('room').value.trim().toUpperCase();if(/^\d{4}$/.test(room))room='KB-'+room;if(!/^KB-\d{4}$/.test(room)){toast(t('badRoom'));return;}connectClient();}break;}
  case 'demo':startDemo();break;
  case 'demoContinue':continueDemo();break;
  case 'demoTogglePause':toggleDemoPause();break;
  case 'showRules':showRules();break;
  case 'closeRules':closeRules();break;
  case 'leave':reset();break;
  case 'addBot':if(role==='host'&&S.phase==='LOBBY'){if(S.players.length>=8){toast(t('minPlayers'));return;}const n=S.players.filter(p=>p.bot).length+1;S.players.push(player(uid(),`Bot ${n}`,true));sync();}break;
  case 'start':if(role==='host'&&S.phase==='LOBBY'){if(S.players.length<3||S.players.length>8){toast(t('minPlayers'));return;}startRound();}break;
  case 'next':if(role==='host'&&S.phase==='SHOWDOWN'&&!S.migrating)startRound();break;
  case 'play':sendAction('ACTION',[...selected]);break;
  case 'pass':sendAction('PASS');break;
  case 'tribute':sendAction('TRIBUTE_SELECT',[...selected]);break;
 }
});
document.addEventListener('keydown',e=>{if(!rulesOpen)return;if(e.key==='Escape'){e.preventDefault();closeRules();}else if(e.key==='Tab'){e.preventDefault();document.querySelector('#rules-popup [data-do="closeRules"]').focus();}});
document.addEventListener('change',e=>{if(e.target.matches('[data-rule]')&&role==='host'&&S.phase==='LOBBY'){S.rules[e.target.dataset.rule]=e.target.checked;sync();}});
render();
</script>
